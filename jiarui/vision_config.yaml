global_vision_force_adapter:
  ros__parameters:
    target_part: ""              # Empty publishes every detected supported part.
    base_frame: panda_link0
    ee_frame: panda_hand
    camera_frame: camera_color_optical_frame
    handeye_yaml_path: /home/masais/Xinyu/cam_calibration/outputs/03_hand_eye/hand_eye_result.npz
    publish_rate: 2.0
    topic_prefix: /vision/global
    debug_view: false
    depth_window: 7
    min_valid_depth_points: 3
    # Global coarse localization follows global_table_intersection_utils_test:
    # RGB pixel ray intersects the robot-base table plane at this Z.
    table_z_m: 0.0
    tf_timeout_sec: 0.2
    realsense_warmup_frames: 15
    color_topic: /camera/camera/color/image_raw
    aligned_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_sec: 0.05
    motion_threshold: 2.0
    stable_frames_required: 10
    consensus_frames: 5
    consensus_tolerance_m: 0.015
    publish_low_confidence: false
    expected_width: 640
    expected_height: 480
    # Flattened [(u0,v0), ...] polygon copied from the calibrated global view.
    work_area_polygon: [104, 0, 568, 0, 588, 330, 455, 480, 120, 480]

local_vision_force_adapter:
  ros__parameters:
    target_part: Gear_large_handle     # Required; notebook or force_control spelling.
    base_frame: panda_link0
    ee_frame: panda_hand
    camera_frame: camera_color_optical_frame
    handeye_yaml_path: /home/masais/Xinyu/cam_calibration/outputs/03_hand_eye/hand_eye_result.npz
    publish_rate: 5.0
    topic_prefix: /vision/local
    debug_view: false
    gripper_axis_mode: y_parallel  # x_parallel or y_parallel; verify on robot.
    min_valid_depth_points: 5
    depth_window: 7
    tf_timeout_sec: 0.2
    realsense_warmup_frames: 15
    color_topic: /camera/camera/color/image_raw
    aligned_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_sec: 0.05
    motion_threshold: 2.0
    stable_frames_required: 10
    consensus_frames: 5
    consensus_tolerance_m: 0.008
    target_roi_width_px: 640
    target_roi_height_px: 480
    publish_low_confidence: false
    expected_width: 640
    expected_height: 480
    # Used only for target_part=Base; names match local_rgbd_grasp_refinement.
    base_hole_target: hole_large  # hole_large, hole_small, or hole_screw
